name: Checks

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Standards and unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin declares PHP 8.1 as its minimum, so the minimum is tested
        # alongside a current release rather than assumed to work.
        php: [ '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install development tooling
        run: composer install --no-interaction --no-progress

      - name: Syntax
        run: find wp-content/plugins/vehicle-report-orders scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: WordPress coding standards
        run: vendor/bin/phpcs

      - name: Unit tests
        run: vendor/bin/phpunit

  integration:
    name: Integration tests against a real WordPress
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, zip
          coverage: none
          tools: composer:v2, wp-cli

      - name: Build the site the way a developer would
        run: ./scripts/setup-local.sh
        env:
          DB_NAME: vehicle_report_ci
          DB_USER: root
          DB_PASSWORD: ci-root
          DB_HOST: 127.0.0.1
          WP_URL: http://localhost:8080

      - name: Everything
        run: ./scripts/check.sh

      - name: What a fresh install still needs from the merchant
        if: always()
        run: wp eval 'foreach ( VehicleReportOrders\Domain\Settings::missing_for_live() as $k => $v ) { echo "- $v\n"; }'
